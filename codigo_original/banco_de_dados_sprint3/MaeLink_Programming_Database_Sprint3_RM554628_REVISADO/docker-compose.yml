services:
  postgres:
    image: postgres:16-alpine
    container_name: maelink-postgres
    environment:
      POSTGRES_DB: maelink_db
      POSTGRES_USER: maelink
      POSTGRES_PASSWORD: maelink123
      POSTGRES_INITDB_ARGS: --encoding=UTF8
    ports:
      - "5433:5432"
    volumes:
      - maelink_pgdata:/var/lib/postgresql/data
      - ./sql/01_ddl.sql:/docker-entrypoint-initdb.d/01_ddl.sql:ro
      - ./sql/02_massa_dados.sql:/docker-entrypoint-initdb.d/02_massa_dados.sql:ro
      - ./sql:/maelink/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maelink -d maelink_db"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  maelink_pgdata:
